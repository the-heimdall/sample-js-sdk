name: CI

# Runs on every pull request and every push to main.
# This workflow NEVER publishes anything - it only checks the code.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No credentials needed: every dependency is public, and this repo
      # deliberately commits no .npmrc.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
